# WaDesk: Postgres, Redis, API, queue worker, web app and Caddy (HTTPS).
# Copy .env.example to .env, fill it in, then: docker compose up -d --build
# Only Caddy is reachable from outside (ports 80 and 443). See DEPLOY.md.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wadesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wadesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadesk -d wadesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The job queue must never have keys evicted, and should survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgres://wadesk:${POSTGRES_PASSWORD}@postgres:5432/wadesk
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - media:/app/storage
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: ./apps/api
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file: .env
    environment: *backend-env
    volumes:
      - media:/app/storage
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://localhost:4000}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  redisdata:
  media:
  caddydata:
  caddyconfig:
